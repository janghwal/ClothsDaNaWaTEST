name: CDNW CI

on:
  push:
    branches: [dev1, feat/* ]


  pull_request:
    branches:
      - dev1

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        ports:
          - 3306:3306
        env:
          MYSQL_DATABASE: ClothsDaNaWa
          MYSQL_ROOT_PASSWORD: 1234
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    env:
      DB_NAME: ClothsDaNaWa
      DB_USERNAME: root
      DB_PASSWORD: 1234
#      SPRING_DATASOURCE_URL: jdbc:mysql://localhost:3306/ClothsDaNaWa
#      SPRING_DATASOURCE_USERNAME: root
#      SPRING_DATASOURCE_PASSWORD: 1234

    steps:
      - name: checkout # github action에 보이는 이름
        uses: actions/checkout@v4 # action의 checkout을 v4버전으로 실행한다.

      - name: java setup
        uses: actions/setup-java@v2 # action에서 java환경을 setup한다.
        with:
          distribution: 'temurin' # AdoptOpenJDK를 명시한다. 이외에 corretto, oracle 등이 있다.
          java-version: '17' # java 버전

      - name: make executable gradlew
        run: chmod +x ./gradlew # chmod를 리눅스에서 동작 시켜서 ./gradlew 파일의 권한을 읽을수 있도록 한다.

      - name: Build with Gradle
        run: ./gradlew build

      - name: Wait for MySQL
        run: sleep 10

      - name: run unittest
        run: |
          ./gradlew clean test

